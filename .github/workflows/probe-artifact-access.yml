name: probe-artifact-access

# Read-only probe: can this repository's own GITHUB_TOKEN list and download the
# Windows exact-SHA build artifacts of the public Runtime repository for the
# commit pinned by the ActingCommand-Runtime submodule? Writes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Locate the exact-SHA build run for the pinned Runtime commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD:ActingCommand-Runtime)
          echo "pinned runtime sha: $sha"
          run=$(gh api "repos/HS7097/ActingCommand-Runtime/actions/workflows/windows-remote-build.yml/runs?head_sha=$sha&status=success&per_page=5" \
                --jq '.workflow_runs | sort_by(.run_attempt) | last | .id // empty')
          [ -n "$run" ] || { echo "::error::no successful exact-SHA build for $sha"; exit 1; }
          echo "run id: $run"
          gh api "repos/HS7097/ActingCommand-Runtime/actions/runs/$run/artifacts" \
            --jq '.artifacts[] | "\(.id) \(.name) \(.size_in_bytes) expires=\(.expires_at)"' | tee artifacts.txt
          id=$(awk '$2 ~ /^actingcommand-runtime-/ {print $1}' artifacts.txt | head -1)
          [ -n "$id" ] || { echo "::error::runtime artifact missing"; exit 1; }
          echo "downloading artifact $id"
          gh api "repos/HS7097/ActingCommand-Runtime/actions/artifacts/$id/zip" > runtime.zip
          ls -la runtime.zip
          unzip -q runtime.zip -d runtime
          ls -la runtime
          echo "--- manifest ---"
          jq '{repository,commit_sha,tree_sha,target,configuration,workflow_run_id,runtime_payload_layout,files:[.files[]|.path]}' runtime/BUILD-MANIFEST.json
          echo "--- verify hashes ---"
          jq -r '.files[] | "\(.sha256)  \(.path)"' runtime/BUILD-MANIFEST.json > sums.txt
          (cd runtime && sha256sum -c ../sums.txt)
          test "$(jq -r .commit_sha runtime/BUILD-MANIFEST.json)" = "$sha" || { echo "::error::manifest commit mismatch"; exit 1; }
          echo "PROBE OK"
